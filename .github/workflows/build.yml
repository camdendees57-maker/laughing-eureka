name: Build VR ImGui .so

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      - name: Configure
        run: |
          cmake -S . -B build             -G Ninja             -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"             -DANDROID_ABI=arm64-v8a             -DANDROID_PLATFORM=android-26             -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Verify library
        run: |
          file build/libvrimgui.so
          readelf -h build/libvrimgui.so | grep -E "Class|Machine"

      - name: Package
        run: |
          mkdir -p artifact
          cp build/libvrimgui.so artifact/
          cp -r include artifact/
          cp -r backends artifact/
          tar -czf vrimgui-arm64.tar.gz artifact

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: vrimgui-arm64
          path: |
            build/libvrimgui.so
            vrimgui-arm64.tar.gz
